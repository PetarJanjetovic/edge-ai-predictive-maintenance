[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-pdm"
version = "1.0.0"
description = "End-to-end edge AI predictive maintenance system"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.117.1",
  "joblib==1.5.2",
  "numpy==2.0.2",
  "scikit-learn==1.6.1",
  "uvicorn==0.36.0",
  "pyserial==3.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[project.scripts]
edge-pdm = "edge_pdm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

